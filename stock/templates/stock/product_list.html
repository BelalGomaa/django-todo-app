<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام إدارة المخازن</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
.container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th { background-color: #3498db; color: white; padding: 15px; text-align: right; }
td { padding: 12px; border-bottom: 1px solid #ddd; color: #333; }
tr:hover { background-color: #f1f1f1; transition: 0.3s; }
.badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #e8f4fd; color: #3498db; }
.price { font-weight: bold; color: #27ae60; }
.admin-btn { display: block; width: fit-content; margin: 20px auto 0; padding: 10px 20px; background: #2c3e50; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
<h2>📦 نظام مراقبة المخزون</h2>
<table>
<thead>
<tr>
<th>اسم المنتج</th>
<th>القسم</th>
<th>الكمية المتاحة</th>
<th>السعر</th>
</tr>
</thead>
<tbody>
{% for product in products %}
<tr>
<td><strong>{{ product.name }}</strong></td>
<td><span class="badge">{{ product.category.name }}</span></td>
<td>{{ product.quantity }} قطعة</td>
<td class="price">{{ product.price }} جنيه</td>
</tr>
{% endfor %}
</tbody>
</table>
<a href="/admin" class="admin-btn">دخول لوحة التحكم</a>
</div>
</body>
</html>
