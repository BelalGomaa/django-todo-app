<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المفكرة اليومية</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        form { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;}
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;}
        button:hover { background-color: #218838; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .completed { text-decoration: line-through; color: #888; }
        .actions a { text-decoration: none; padding: 6px 12px; border-radius: 4px; color: white; margin-right: 5px; font-size: 14px;}
        .toggle-btn { background-color: #ffc107; color: black; }
        .delete-btn { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>مفكرة المهام - تطبيق بلال</h1>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="اكتب مهمة جديدة هنا..." required>
            <button type="submit">إضافة مهمة</button>
        </form>

        <ul>
            {% for task in tasks %}
                <li>
                    <span class="{% if task.completed %}completed{% endif %}">
                        {{ task.title }}
                    </span>
                    <div class="actions">
                        <a href="{% url 'toggle_task' task.id %}" class="toggle-btn">
                            {% if task.completed %}تراجع{% else %}إنجاز{% endif %}
                        </a>
                        <a href="{% url 'delete_task' task.id %}" class="delete-btn">حذف</a>
                    </div>
                </li>
            {% empty %}
                <li style="text-align: center; color: #888;">لا توجد مهام حالياً.. ابدأ بإضافة مهمتك الأولى!</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
